<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Entrevistas con IA</title>
    <!-- Incluyendo Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header / Barra de navegación -->
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-lg shadow-md">IA</div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Evaluador de Entrevistas</h1>
            </div>
            <span class="text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sistema Activo
            </span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-4xl mx-auto px-6 py-10 w-full flex-grow">
        
        <!-- Tarjeta de Acciones -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
            <h2 class="text-lg font-semibold text-slate-900 mb-2">Procesar Nueva Entrevista</h2>
            <p class="text-sm text-slate-500 mb-6">Sube el archivo de audio de la entrevista para generar el análisis automático y la validación del RUT.</p>
            
            <form id="uploadForm" class="space-y-6">
                <!-- Zona de carga de archivos -->
                <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-indigo-500 transition-colors bg-slate-50/50 cursor-pointer">
                    <svg class="mx-auto h-12 w-12 text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <label for="audioFile" class="cursor-pointer">
                        <span class="text-indigo-600 font-medium hover:text-indigo-700">Haz clic para seleccionar un audio</span>
                        <span class="text-slate-500 block text-sm mt-1">o arrástralo y suéltalo aquí (MP3, WAV, M4A)</span>
                    </label>
                    <input type="file" id="audioFile" name="audio" accept="audio/*" class="hidden">
                    <p id="fileName" class="text-sm font-medium text-slate-700 mt-3"></p>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl shadow-md transition-all duration-200 flex items-center justify-center gap-2">
                    <span>Analizar Entrevista</span>
                </button>
            </form>
        </div>

        <!-- Sección de Resultados (Oculta por defecto hasta que responde la IA) -->
        <div id="resultContainer" class="hidden space-y-6">
            <!-- Validación RUT -->
            <div id="rutResult" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center justify-between">
                <div>
                    <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Validación de RUT</h3>
                    <p id="rutText" class="text-lg font-bold text-slate-900 mt-1">-</p>
                </div>
                <div id="rutBadge" class="px-3 py-1 rounded-full text-xs font-semibold"></div>
            </div>

            <!-- Informe de la IA -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Informe Generado por IA</h3>
                <div id="aiReport" class="text-slate-700 leading-relaxed whitespace-pre-line bg-slate-50 p-4 rounded-lg border border-slate-100 text-sm">
                    <!-- Aquí se inyectará la respuesta -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        Plataforma de Entrevistas Inteligentes con Flask y OpenAI
    </footer>

    <!-- Script para mostrar el nombre del archivo seleccionado -->
    <script>
        const fileInput = document.getElementById('audioFile');
        const fileNameDisplay = document.getElementById('fileName');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = `Archivo seleccionado: ${e.target.files[0].name}`;
            } else {
                fileNameDisplay.textContent = '';
            }
        });
    </script>
</body>
</html>
