<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Entrevistas con IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-4xl mx-auto py-10 px-4">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-indigo-600">🎙️ Sistema de Entrevistas e Informes IA</h1>
            <p class="text-gray-500 mt-2">Sube audios, procesa con IA y busca historiales por RUT.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Subir Entrevista -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Subir Nueva Entrevista</h2>
                <form id="uploadForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">RUT del Entrevistado</label>
                        <input type="text" id="rut" name="rut" required placeholder="Ej: 12345678-9" 
                               class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        <p class="text-xs text-gray-400 mt-1">Sin puntos, con guion y dígito verificador.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Archivo de Audio</label>
                        <input type="file" id="audio" name="audio" accept="audio/*" required 
                               class="w-full text-sm text-gray-500">
                    </div>
                    <button type="submit" id="submitBtn" 
                            class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">
                        Procesar con IA
                    </button>
                </form>
                <div id="loading" class="hidden text-center mt-4 text-indigo-600 font-medium">
                    ⏳ Procesando audio con Whisper y redactando informe... (Espera un momento)
                </div>
            </div>

            <!-- Consultar Base de Datos -->
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Consultar Base de Datos</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Buscar por RUT</label>
                        <div class="flex gap-2">
                            <input type="text" id="searchRut" placeholder="Ej: 12345678" 
                                   class="w-full px-3 py-2 border rounded-lg outline-none">
                            <button onclick="buscarEntrevista()" 
                                    class="bg-gray-800 text-white px-4 py-2 rounded-lg hover:bg-gray-900 transition">
                                Buscar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Resultados -->
        <div id="resultContainer" class="mt-10 bg-white p-6 rounded-xl shadow-md border border-gray-100 hidden">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Resultado</h2>
            <div id="resultContent" class="space-y-4 whitespace-pre-line text-gray-700 leading-relaxed"></div>
        </div>
    </div>

    <script>
        // Función para validar RUT chileno básico
        function validarRut(rutCompleto) {
            rutCompleto = rutCompleto.replace(/\./g, '').replace(/-/g, '');
            if (rutCompleto.length < 2) return false;
            
            let cuerpo = rutCompleto.slice(0, -1);
            let dv = rutCompleto.slice(-1).toUpperCase();
            
            let suma = 0;
            let multiplo = 2;
            
            for (let i = cuerpo.length - 1; i >= 0; i--) {
                suma += parseInt(cuerpo.charAt(i)) * multiplo;
                multiplo = multiplo < 7 ? multiplo + 1 : 2;
            }
            
            let dvEsperado = 11 - (suma % 11);
            let dvCalculado = dvEsperado === 11 ? '0' : dvEsperado === 10 ? 'K' : dvEsperado.toString();
            
            return dvCalculado === dv;
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const rutInput = document.getElementById('rut').value.trim();
            
            // Validar RUT antes de enviar
            if (!validarRut(rutInput)) {
                alert('El RUT ingresado no es válido. Por favor revísalo (Ej: 12345678-9).');
                return;
            }

            const formData = new FormData();
            formData.append('rut', rutInput);
            formData.append('audio', document.getElementById('audio').files[0]);

            const loading = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');

            loading.classList.remove('hidden');
            submitBtn.disabled = true;
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (response.ok) {
                    resultContent.innerHTML = `<h3 class="font-bold text-lg text-indigo-700">Informe generado para RUT: ${data.rut}</h3><hr class="my-2">${data.informe}`;
                    resultContainer.classList.remove('hidden');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Error de red al conectar con el servidor.');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        async function buscarEntrevista() {
            const rut = document.getElementById('searchRut').value.trim();
            if (!rut) return alert('Ingresa un RUT para buscar');
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');

            try {
                const response = await fetch(`/buscar?rut=${encodeURIComponent(rut)}`);
                const data = await response.json();
                if (response.ok) {
                    if (data.resultados.length === 0) {
                        resultContent.innerHTML = `<p class="text-gray-500">No se encontraron registros para ese RUT.</p>`;
                    } else {
                        let html = `<h3 class="font-bold text-lg text-indigo-700">Registros Encontrados (${data.resultados.length})</h3>`;
                        data.resultados.forEach(item => {
                            html += `<div class="border-t pt-4 mt-4"><p class="text-sm text-gray-400">Fecha: ${item.fecha} | RUT: ${item.rut}</p><div class="mt-2 p-4 bg-gray-50 rounded-lg whitespace-pre-line">${item.informe}</div></div>`;
                        });
                        resultContent.innerHTML = html;
                    }
                    resultContainer.classList.remove('hidden');
                }
            } catch (err) {
                alert('Error al realizar la búsqueda.');
            }
        }
    </script>
</body>
</html>
